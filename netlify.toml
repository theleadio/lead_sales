# Same Netlify setup as lead_crm: build the Next.js app (Netlify installs and
# updates @netlify/plugin-nextjs itself, so it isn't pinned here).

[build]
  command = "npm run build"
  publish = ".next"

# NEXT_PUBLIC_* values are inlined into the browser bundle by design, so the
# secrets scan must not fail the build on them. Every other key is scanned.
# Also skipped, because their values are not secrets and are plain words or
# URLs that turn up all over the code (found in the 25 Nov deploy log): DEV_ROLE
# (a role name), PUBLIC_ALLOWED_ORIGINS (a list of origins, lead_crm's), and
# APP_BASE_URL and EMAIL_FROM (the app's address and the email sender).
# RESEND_API_KEY and EMAIL_UNSUBSCRIBE_SECRET stay scanned.
# docs/** is design notes that are never deployed; they legitimately quote
# env values (a Meta dataset id, the app URL), which tripped the scan and
# failed every deploy since 14 Nov.
# scripts/landing-pages/** is the landing page generator. It is never deployed,
# and its page copy holds the public CDN location id and the public website
# URL (SALESPROCESS_LOCATION_ID, PUBLIC_WEBSITE_URL), which failed the 26 Nov
# production build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,APP_BASE_URL,EMAIL_FROM,DEV_ROLE,PUBLIC_ALLOWED_ORIGINS"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,docs/**,scripts/landing-pages/**"
